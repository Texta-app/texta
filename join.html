<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up for Text Updates</title>
  <meta name="description" content="Subscribe to receive text message updates." />
  <meta name="robots" content="noindex" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand: #1D9E75;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg-input: #f8fafc;
    }

    html, body {
      min-height: 100%;
      font-family: 'DM Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 24px 16px;
    }

    /* Loading state */
    #loading {
      text-align: center;
      color: var(--muted);
      font-size: 15px;
    }

    /* Error state */
    #error-state {
      display: none;
      text-align: center;
      color: var(--muted);
      max-width: 320px;
    }
    #error-state h2 { font-size: 20px; color: var(--text); margin-bottom: 8px; }

    /* Card */
    .card {
      display: none; /* shown after load */
      background: #fff;
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 40px rgba(0,0,0,0.10), 0 1px 8px rgba(0,0,0,0.06);
    }

    @media (max-width: 480px) {
      .card { padding: 32px 24px; }
    }

    /* Accent bar */
    .accent-bar {
      height: 4px;
      width: 40px;
      border-radius: 2px;
      margin-bottom: 20px;
      background: var(--brand);
    }

    /* Logo */
    .logo-wrap {
      margin-bottom: 20px;
    }
    .logo-wrap img {
      max-height: 52px;
      max-width: 180px;
      object-fit: contain;
      display: block;
    }

    /* Headline */
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .subheadline {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* Form */
    form { display: flex; flex-direction: column; gap: 12px; }

    .field input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--bg-input);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(29,158,117,0.12);
    }
    .field input.error-input {
      border-color: #f87171;
    }
    .field-error {
      font-size: 12px;
      color: #dc2626;
      margin-top: 4px;
      display: none;
    }

    /* Phone row */
    .phone-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .phone-flag {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-input);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 18px;
      user-select: none;
    }

    /* Submit */
    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 4px;
      letter-spacing: 0.01em;
    }
    button[type="submit"]:hover { opacity: 0.92; }
    button[type="submit"]:active { transform: scale(0.99); }
    button[type="submit"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Opt-in disclosure — REQUIRED for TCPA compliance */
    .disclosure {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.55;
      text-align: center;
      margin-top: 4px;
    }

    /* Success state */
    .success-state {
      display: none;
      text-align: center;
      padding: 8px 0;
    }
    .success-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      background: rgba(29,158,117,0.12);
    }
    .success-state h2 {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }
    .success-state p {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* General error banner */
    .error-banner {
      display: none;
      background: #fff1f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      text-align: center;
    }

    /* Attribution */
    .attribution {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: #cbd5e1;
    }
    .attribution a {
      color: inherit;
      text-decoration: none;
    }
    .attribution a:hover { color: var(--brand); }
  </style>
</head>
<body>

  <div id="loading">Loading…</div>

  <div id="error-state">
    <h2>Form not found</h2>
    <p>This sign-up link may be inactive or no longer available.</p>
  </div>

  <div class="card" id="card">
    <!-- Populated by JS -->
    <div id="form-area"></div>
    <div class="attribution">Powered by <a href="https://texta.me" target="_blank" rel="noopener">Texta</a></div>
  </div>

  <script>
    const API = 'https://texta-api.textaops.workers.dev'

    // Extract slug from URL: texta.me/join/[slug]
    function getSlug() {
      const parts = location.pathname.split('/')
      // pathname: /join/my-slug
      const joinIdx = parts.indexOf('join')
      if (joinIdx !== -1 && parts[joinIdx + 1]) return parts[joinIdx + 1]
      return null
    }

    function el(id) { return document.getElementById(id) }

    async function init() {
      const slug = getSlug()
      if (!slug) return showError()

      let form
      try {
        const res = await fetch(`${API}/join/${slug}`)
        if (!res.ok) return showError()
        form = await res.json()
        if (form.error) return showError()
      } catch (e) {
        return showError()
      }

      renderForm(form)
    }

    function showError() {
      el('loading').style.display = 'none'
      el('error-state').style.display = 'block'
    }

    function renderForm(form) {
      el('loading').style.display = 'none'

      // Apply brand color
      document.documentElement.style.setProperty('--brand', form.brand_color || '#1D9E75')

      const card = el('card')
      const area = el('form-area')

      // Build inner HTML
      let html = ''

      // Logo
      if (form.logo_url) {
        html += `<div class="logo-wrap"><img src="${esc(form.logo_url)}" alt="Logo" /></div>`
      }

      // Accent bar
      html += `<div class="accent-bar"></div>`

      // Headline
      html += `<h1>${esc(form.headline || 'Join our text list')}</h1>`

      // Subheadline
      if (form.subheadline) {
        html += `<div class="subheadline">${esc(form.subheadline)}</div>`
      }

      // Form fields
      html += `<form id="signup-form">`
      html += `<div class="error-banner" id="form-error"></div>`

      if (form.collect_first_name) {
        html += `
          <div class="field">
            <input type="text" name="first_name" placeholder="First name" autocomplete="given-name" />
          </div>`
      }

      if (form.collect_last_name) {
        html += `
          <div class="field">
            <input type="text" name="last_name" placeholder="Last name" autocomplete="family-name" />
          </div>`
      }

      if (form.collect_email) {
        html += `
          <div class="field">
            <input type="email" name="email" placeholder="Email address" autocomplete="email" />
            <div class="field-error" id="email-error">Please enter a valid email address.</div>
          </div>`
      }

      // Phone — always required
      html += `
        <div class="field">
          <div class="phone-row">
            <div class="phone-flag" title="United States">🇺🇸</div>
            <input type="tel" name="phone" placeholder="(555) 555-5555"
              autocomplete="tel" inputmode="tel" required style="flex:1" />
          </div>
          <div class="field-error" id="phone-error">Please enter a valid US phone number.</div>
        </div>`

      // Submit
      html += `
        <button type="submit" id="submit-btn">${esc(form.button_text || 'Subscribe')}</button>
        <div class="disclosure">
          By subscribing, you agree to receive recurring automated text messages from this number.
          Consent is not a condition of purchase. Reply <strong>STOP</strong> to unsubscribe,
          <strong>HELP</strong> for help. Message &amp; data rates may apply.
        </div>`

      html += `</form>`

      // Success state (hidden initially)
      html += `
        <div class="success-state" id="success-state">
          <div class="success-icon">
            <svg width="28" height="28" fill="none" stroke="#1D9E75" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M20 6L9 17l-5-5"/>
            </svg>
          </div>
          <h2>You're in!</h2>
          <p>${esc(form.success_message || 'Thanks for subscribing. We\'ll be in touch.')}</p>
        </div>`

      area.innerHTML = html
      card.style.display = 'block'

      // Wire up form
      const signupForm = document.getElementById('signup-form')
      signupForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        await handleSubmit(form.slug, signupForm)
      })

      // Phone formatting
      const phoneInput = signupForm.querySelector('input[name="phone"]')
      phoneInput.addEventListener('input', () => formatPhone(phoneInput))
    }

    function formatPhone(input) {
      let v = input.value.replace(/\D/g, '').substring(0, 10)
      if (v.length >= 7) v = `(${v.substring(0,3)}) ${v.substring(3,6)}-${v.substring(6)}`
      else if (v.length >= 4) v = `(${v.substring(0,3)}) ${v.substring(3)}`
      else if (v.length > 0) v = `(${v}`
      input.value = v
    }

    async function handleSubmit(slug, form) {
      const btn = document.getElementById('submit-btn')
      const errorBanner = document.getElementById('form-error')
      const phoneInput = form.querySelector('input[name="phone"]')

      // Clear errors
      errorBanner.style.display = 'none'
      document.querySelectorAll('.error-input').forEach(el => el.classList.remove('error-input'))

      // Validate phone
      const rawPhone = (phoneInput.value || '').replace(/\D/g, '')
      if (rawPhone.length !== 10) {
        phoneInput.classList.add('error-input')
        document.getElementById('phone-error').style.display = 'block'
        phoneInput.focus()
        return
      }

      // Validate email if present
      const emailInput = form.querySelector('input[name="email"]')
      if (emailInput && emailInput.value && !emailInput.value.includes('@')) {
        emailInput.classList.add('error-input')
        document.getElementById('email-error').style.display = 'block'
        emailInput.focus()
        return
      }

      btn.disabled = true
      btn.textContent = 'Subscribing…'

      const payload = {
        phone: '+1' + rawPhone,
        first_name: (form.querySelector('input[name="first_name"]')?.value || '').trim() || undefined,
        last_name: (form.querySelector('input[name="last_name"]')?.value || '').trim() || undefined,
        email: emailInput?.value.trim() || undefined,
      }

      try {
        const res = await fetch(`${API}/join/${slug}/subscribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        })
        const data = await res.json()

        if (data.success === false && data.error) {
          // Opt-out case or other handled error
          errorBanner.textContent = data.error
          errorBanner.style.display = 'block'
          btn.disabled = false
          btn.textContent = form.querySelector('button[type="submit"]')?.textContent || 'Subscribe'
          return
        }

        // Success
        document.getElementById('signup-form').style.display = 'none'
        document.getElementById('success-state').style.display = 'block'

      } catch (e) {
        errorBanner.textContent = 'Something went wrong. Please try again.'
        errorBanner.style.display = 'block'
        btn.disabled = false
        btn.textContent = 'Subscribe'
      }
    }

    function esc(str) {
      if (!str) return ''
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
    }

    init()
  </script>
</body>
</html>

<!--
=============================================================
DEPLOYMENT NOTES — texta.me/join/[slug]
=============================================================

This is a single static file deployed to the texta.me marketing
site (Cloudflare Pages). Because the slug is a path segment, you
need to tell Cloudflare Pages to route all /join/* requests to
this file.

OPTION A — Cloudflare Pages _redirects file (recommended)
----------------------------------------------------------
Add a _redirects file to the root of the marketing site repo:

  /join/*   /join.html   200

The 200 means "rewrite" (serve join.html but keep the URL as-is).
This gives the JS the slug to parse from location.pathname.

File structure in your repo:
  index.html
  join.html        ← this file
  _redirects       ← routing rule
  api.html
  terms.html
  privacy.html

OPTION B — Cloudflare Worker (if you need more control)
--------------------------------------------------------
Handle /join/* in the marketing site's Cloudflare Worker and
serve this HTML directly.

=============================================================
WIDGET (widget.js) — future file
=============================================================
The embed code in SignupForms.jsx references:
  <script src="https://texta.me/widget.js" data-slug="..." data-mode="inline">

For the MVP, the embed options (link and button) work without widget.js.
The widget.js file can be a small JS that:
1. Reads data-slug from the script tag
2. Creates an iframe pointing to texta.me/join/[slug]
3. Injects it inline where the script tag lives

Build this as a follow-on task. The link/button embed options
work today without it.
=============================================================
-->
